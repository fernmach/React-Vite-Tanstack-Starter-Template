application:
  name: Instruções de Montagem de MPV
  purpose: Permitir consulta pública de instruções e reservar ações de manutenção a usuários autenticados com permissão.
  scope:
    - Exibir uma listagem paginada de instruções de montagem de MPV.
    - Pesquisar instruções por um termo livre e limpar a pesquisa atual.
    - Iniciar os fluxos de criação e edição de uma instrução.
    - Alterar o estado ativo de uma instrução e solicitar sua exclusão.
    - Distinguir visitantes, editores e administradores nas ações de manutenção.
  out_of_scope:
    - Especificar os campos e o layout das telas de criação e edição, que não aparecem na evidência fornecida.
    - Implementar o backend real de autenticação, persistência, cookies ou autorização.
    - Reproduzir literalmente tecnologia, URLs legadas ou bibliotecas apenas sugeridas pela captura.
  assumptions:
    - A aba Instruções representa o item ativo da navegação principal.
    - O campo de pesquisa aceita um termo livre aplicado ao código e à descrição da instrução após o envio do formulário.
    - Os ícones de lápis e lixeira representam respectivamente edição e exclusão da linha.
    - O controle na coluna Ativo salva imediatamente, anuncia o resultado e restaura o valor anterior em caso de falha.
    - A exclusão exige confirmação explícita e arquiva o registro para permitir recuperação administrativa.
    - A rota canônica da listagem será /instrucoes até que a rota real seja confirmada.
    - A interface e seus anúncios acessíveis usam português do Brasil.
    - A consulta permanece pública; ações de manutenção dependem das permissões validadas da sessão.
  open_questions: []
  conflicts: []
  recommended_decisions: []
  authentication_required: true
